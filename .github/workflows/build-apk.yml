name: Build imcut Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Detect Android project directory
        id: detect
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android-app/settings.gradle.kts" ]; then
            echo "dir=android-app" >> "$GITHUB_OUTPUT"
          else
            echo "::error::settings.gradle.kts tidak ditemukan di root maupun di folder android-app/"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload imcut-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: imcut-debug-apk
          path: ${{ steps.detect.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
